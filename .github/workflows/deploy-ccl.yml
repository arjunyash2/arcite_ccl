name: Deploy CCL

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          cp .github/known_hosts "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" 'set -e
              cd /opt/arcite-ccl
              git pull origin main
              docker compose \
                -f compose.yaml \
                -f compose.host-nginx.yaml \
                up -d --build
              docker compose \
                -f compose.yaml \
                -f compose.host-nginx.yaml \
                ps
              for attempt in $(seq 1 30); do
                status=$(docker inspect --format '{{.State.Health.Status}}' arcite-ccl-app-1 2>/dev/null || true)
                if [ "$status" = healthy ]; then
                  break
                fi
                if [ "$status" = unhealthy ]; then
                  docker compose \
                    -f compose.yaml \
                    -f compose.host-nginx.yaml \
                    logs --tail=100 app
                  exit 1
                fi
                sleep 2
              done
              test "$(docker inspect --format '{{.State.Health.Status}}' arcite-ccl-app-1)" = healthy
              curl --fail http://127.0.0.1:8085'
