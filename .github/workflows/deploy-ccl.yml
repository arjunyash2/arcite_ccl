name: Deploy CCL

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check VPS host fingerprint
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          echo "Resolved VPS host: $VPS_HOST"
          ssh-keyscan -T 10 -p 22 -t ed25519 "$VPS_HOST" 2>/dev/null \
            | ssh-keygen -lf - -E sha256

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 22
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          script_stop: true
          script: |
            set -e
            cd /opt/arcite-ccl
            git pull origin main
            docker compose \
              -f compose.yaml \
              -f compose.host-nginx.yaml \
              up -d --build
            docker compose \
              -f compose.yaml \
              -f compose.host-nginx.yaml \
              ps
            curl --fail http://127.0.0.1:8085
