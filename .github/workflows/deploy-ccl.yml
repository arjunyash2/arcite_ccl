name: Deploy CCL

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check VPS host fingerprint
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_FINGERPRINT: SHA256:QOz7U+JDfPMkToEwm+Fvw5fcy2AQEHCnoVUf7wb5CzY
        run: |
          set -euo pipefail
          echo "Resolved VPS host: $VPS_HOST"
          actual="$(ssh-keyscan -T 10 -p 22 -t rsa "$VPS_HOST" 2>/dev/null | ssh-keygen -lf - -E sha256 | awk '{print $2; exit}')"
          test "$actual" = "$VPS_SSH_FINGERPRINT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 22
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:QOz7U+JDfPMkToEwm+Fvw5fcy2AQEHCnoVUf7wb5CzY
          script: |
            set -e
            cd /opt/arcite-ccl
            git pull origin main
            docker compose \
              -f compose.yaml \
              -f compose.host-nginx.yaml \
              up -d --build
            docker compose \
              -f compose.yaml \
              -f compose.host-nginx.yaml \
              ps
            curl --fail http://127.0.0.1:8085
